<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- VEN - top row -->
  <text x="50" y="40" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" text-anchor="middle" fill="url(#tealGradient)">VEN</text>
  
  <!-- T - bottom row -->
  <text x="25" y="70" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" text-anchor="middle" fill="url(#tealGradient)">T</text>
  
  <!-- Fan icon replacing E - bottom row -->
  <g transform="translate(50, 55)">
    <!-- Fan blades -->
    <path d="M 0 -12 L 4 0 L 0 12 L -4 0 Z" fill="url(#tealGradient)" opacity="0.9"/>
    <path d="M -8 -12 L -4 0 L -8 12 L -12 0 Z" fill="url(#tealGradient)" opacity="0.7"/>
    <path d="M 8 -12 L 12 0 L 8 12 L 4 0 Z" fill="url(#tealGradient)" opacity="0.7"/>
    <path d="M -4 -12 L 0 0 L -4 12 L -8 0 Z" fill="url(#tealGradient)" opacity="0.5"/>
    <path d="M 4 -12 L 8 0 L 4 12 L 0 0 Z" fill="url(#tealGradient)" opacity="0.5"/>
    <!-- Center hub -->
    <circle cx="0" cy="0" r="3" fill="#0d9488"/>
    <circle cx="0" cy="0" r="1.5" fill="#14b8a6"/>
  </g>
</svg>
